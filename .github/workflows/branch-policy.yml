name: Branch Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-branch-policy:
    name: Validate branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate source and target branches
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          echo "Source branch: ${HEAD_BRANCH}"
          echo "Target branch: ${BASE_BRANCH}"

          if [[ "${BASE_BRANCH}" == "main" ]]; then
            if [[ "${HEAD_BRANCH}" == "develop" ]]; then
              echo "Valid production promotion: develop -> main"
              exit 0
            fi

            if [[ "${HEAD_BRANCH}" == hotfix/* ]]; then
              echo "Valid production hotfix: ${HEAD_BRANCH} -> main"
              exit 0
            fi

            echo "::error::Only 'develop' or 'hotfix/*' may target main."
            echo "::error::Invalid flow: ${HEAD_BRANCH} -> main"
            exit 1
          fi

          if [[ "${BASE_BRANCH}" == "develop" ]]; then
            case "${HEAD_BRANCH}" in
              feature/*|fix/*|refactor/*|docs/*|test/*|chore/*)
                echo "Valid working branch -> develop"
                exit 0
                ;;
              hotfix/*)
                echo "Valid hotfix propagation -> develop"
                exit 0
                ;;
              *)
                echo "::error::Invalid source branch for develop: ${HEAD_BRANCH}"
                exit 1
                ;;
            esac
          fi

          echo "::error::Unsupported target branch: ${BASE_BRANCH}"
          exit 1
