# openspec/config.yaml — SDD project config
# Generated by sdd-init on 2026-09-21.
schema: spec-driven

context: |
  SvelteKit + TypeScript (Svelte 5, runes) with @sveltejs/adapter-cloudflare,
  deployed to Cloudflare Pages (free tier) via wrangler@3 on merge to main.
  Public GitHub repo: BlancoCavallero/sistema-tareas; origin re-pointed from
  the Estructura template; develop + main protected (1 approval or CI-only).
  Planned product: personal organizer — quick tasks (boolean), calendar
  objectives (exams/deadlines), document library (PDF/DOC originals), study
  pages (subject -> topic -> main ideas with completion progress).
  CI chain: scripts/ci.sh runs npm ci && npm run lint && npm run test &&
  npm run build (fail on first error), gated by ci.yml on PRs/pushes to
  develop/main; deploy.yml publishes Pages on merge to main.
  Conventions: Conventional Commits with scope; feature/*|fix/*|refactor/*|
  docs/*|test/*|chore/*|hotfix/* target develop, main only from develop or
  hotfix; meaningful changes trace to an Issue. Branch policy enforced by
  .github/workflows/branch-policy.yml.

# Strict TDD is disabled: standard mode with a real runner now. The workspace
# test command covers the single project root (npm run test -> vitest, jsdom +
# @testing-library/svelte). Revisit strict_tdd if a per-feature TDD discipline
# is adopted.
strict_tdd: false

testing:
  detected: 2026-09-21
  strict_tdd: false
  note: >
    Vitest 4 (jsdom) + @testing-library/svelte. Single project root at the
    workspace root (package.json). Test command: npm run test. CI chain in
    scripts/ci.sh: npm ci && npm run lint && npm run test && npm run build.

  projects:
    - root: "."
      test_command: "npm run test"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas